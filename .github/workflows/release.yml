name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: >-
          Version bumps must land before release; leave this set to skip
        required: true
        default: skip
  repository_dispatch:
    types: [do-release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.gem.outputs.tag }}
    env:
      NEXT_VERSION: >-
        ${{ github.event.inputs.next_version ||
        github.event.client_payload.next_version || 'skip' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Require a reviewed version bump
        run: |
          if [ "$NEXT_VERSION" != skip ]; then
            echo "::error::Bump and tag the version through a reviewed change, then dispatch with next_version=skip."
            exit 1
          fi
      - name: Verify release tag
        id: gem
        run: |
          version=$(ruby -Ilib -relkrb/version -e 'puts Elkrb::VERSION')
          tag="v${version}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          head_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "${tag}^{commit}")
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::${tag} does not point to the release commit ${head_commit}."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "path=pkg/elkrb-${version}.gem"
          } >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Build release gem
        run: |
          mkdir -p pkg
          gem build elkrb.gemspec --output "${{ steps.gem.outputs.path }}"
      - name: Check published version
        id: published
        env:
          VERSION: ${{ steps.gem.outputs.version }}
        run: |
          published=$(ruby -rjson -rnet/http -e '
            uri = URI("https://rubygems.org/api/v1/versions/elkrb.json")
            versions = JSON.parse(Net::HTTP.get(uri))
            puts versions.any? { |release| release.fetch("number") == ENV.fetch("VERSION") }
          ')
          echo "already=${published}" >> "$GITHUB_OUTPUT"
      - name: Configure RubyGems trusted publishing
        if: steps.published.outputs.already != 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish gem
        if: steps.published.outputs.already != 'true'
        run: gem push "${{ steps.gem.outputs.path }}"

  github-release:
    name: github-release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --verify-tag --generate-notes
          fi
