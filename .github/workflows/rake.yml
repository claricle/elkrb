name: rake

permissions:
  contents: read

on:
  push:
    # v2 is the integration branch, so it needs push coverage of its own;
    # pull_request below is unfiltered and covers PRs into it.
    branches: [ master, main, v2 ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      # Required, not a preference. generic-rake.yml's `tests-passed` job
      # declares `permissions: contents: write`; a called workflow may not
      # request more than its caller grants, and this caller grants
      # `contents: read`. Every elkrb run since 2025-11-14 was refused at
      # startup because of it -- startup_failure creates zero jobs, so no
      # check is reported at all and it reads as "no CI" rather than
      # "CI is broken". The input exists for exactly this case; its own
      # description reads: "When false, skip the cascade job entirely so
      # callers can declare permissions: contents: read (least privilege)."
      #
      # Cost: no `tests-passed` / `do-release` repository_dispatch is fired.
      # release.yml does listen for `do-release`, but no repository_dispatch
      # has ever fired on this repo and both releases were run by hand
      # (`workflow_dispatch`), so the cost is real in principle and zero in
      # practice. Releases stay manual.
      cascade: false

  # The shared matrix does not cover the version this gem promises.
  # generic-rake.yml takes 13 inputs and none selects a ruby version or an OS,
  # so the matrix cannot be overridden by a caller. prepare-rake.yml fetches
  # https://raw.githubusercontent.com/metanorma/ci/main/.github/workflows/ruby-matrix.json
  # at runtime, and that file lists ruby 3.3, 3.4 and 4.0 (experimental) --
  # no 3.2. The gemspec floor is ">= 3.2.0" and is deliberate: lutaml-model
  # 0.8 does not parse on 3.1 or below. This job covers that one version and
  # nothing else; the shared workflow covers the rest.
  #
  # Note the two URLs prepare-rake.yml fetches (ruby-matrix.json, config.json)
  # are hardcoded to metanorma/ci's `main` and re-read on every run, so pinning
  # the `uses:` ref above would not pin them. That is by design, and it means
  # this job is the only leg of elkrb's matrix that elkrb itself controls and
  # that a reviewer can read from this tree.
  #
  # Blocking on purpose. An advisory job guarding a promise made to consumers
  # of the gem is not a guard.
  ruby-floor:
    name: rake (ruby 3.2, gemspec floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-ruby-floor-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          # No Gemfile.lock is committed. setup-ruby runs `bundle lock` first,
          # which re-resolves to the latest compatible gems and yields the
          # cache key, then installs -- so no separate `bundle install` step.
          bundler-cache: true
      # The whole default task rather than its two commands separately, so CI
      # and a local `bundle exec rake` cannot drift apart.
      - run: bundle exec rake
