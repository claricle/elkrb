name: rake

# Default for every job. The `rake` job below raises its own grant; nothing
# else in this file needs more than read.
permissions:
  contents: read

on:
  push:
    # v2 is the integration branch, so it needs push coverage of its own;
    # pull_request below is unfiltered and covers PRs into it.
    branches: [ master, main, v2 ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main

    # MEASURED, not assumed. generic-rake.yml's `tests-passed` job declares
    # `permissions: contents: write`, and GitHub validates a called workflow's
    # permission requests against the CALLING JOB before it evaluates any
    # `if:`. So a caller granting only `contents: read` is refused at startup,
    # which creates zero jobs and reports no check at all -- it reads as "no CI
    # configured" rather than "CI is broken". That refused every run of this
    # workflow from 2026-08-19 until this commit.
    #
    # Nothing changed here to cause it: this caller was byte-identical from the
    # initial commit until 2026-09-04. metanorma/ci commit 30a34e4 (2026-05-12,
    # "add write permissions to tests passed") added the grant upstream, and
    # `uses: ...@main` picked it up with no commit to elkrb.
    #
    # `cascade: false` does NOT avoid this, so do not "simplify" the grant away
    # by relying on it. Run 34117181565 carried `cascade: false` under a
    # `contents: read` caller and still gave startup_failure with zero jobs;
    # run 34118177872 adds the grant and starts 12 jobs.
    permissions:
      contents: write

    with:
      # Skip the `tests-passed` / `do-release` repository_dispatch. The grant
      # above makes the call legal; this keeps it unused, and `tests-passed`
      # reports as `skipped`. `do-release` fires on v* tags and release.yml
      # listens for it, so leaving the cascade on would newly auto-publish on
      # every tag. Both elkrb releases to date were run by hand and no
      # repository_dispatch has ever fired here. Releases stay manual; flip
      # this to true in a PR of its own if that should change.
      cascade: false

  # The shared matrix does not cover the version this gem promises.
  # generic-rake.yml takes 13 workflow_call inputs and none of them selects a
  # ruby version or an OS, so a caller cannot override the matrix.
  # prepare-rake.yml fetches
  # https://raw.githubusercontent.com/metanorma/ci/main/.github/workflows/ruby-matrix.json
  # at run time, and that file lists ruby 3.3, 3.4 and 4.0 (experimental) --
  # no 3.2. The gemspec floor is ">= 3.2.0" and is deliberate: lutaml-model
  # 0.8 does not parse on 3.1 or below. This job covers that one version and
  # nothing else; the shared workflow covers the rest. The alternative that
  # would delete this job is raising the gemspec floor to 3.3, which the shared
  # matrix already tests -- that breaks consumers, so it is not taken here.
  #
  # Note the URLs prepare-rake.yml fetches are hardcoded to metanorma/ci's
  # `main` and re-read on every run. Pinning the `uses:` ref above would pin
  # the workflow logic, but not those two files -- the matrix would still come
  # from whatever `main` holds at run time. So this job is the only leg of
  # elkrb's matrix that elkrb itself controls and that a reviewer can read
  # from this tree.
  #
  # Blocking on purpose. An advisory job guarding a promise made to consumers
  # of the gem is not a guard.
  ruby-floor:
    name: rake (ruby 3.2.0, gemspec floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # generic-rake.yml cancels a superseded in-flight run on the same ref for
    # its own matrix legs; keep that behaviour for this one.
    #
    # Keyed on github.ref, NOT on upstream's `github.head_ref || github.ref_name`.
    # Neither of those is unique: head_ref is the SOURCE BRANCH NAME only, so two
    # fork PRs both opened from `patch-1` share a group and cancel each other,
    # and ref_name drops refs/heads vs refs/tags, so the tag `v2` and the branch
    # `v2` collapse -- and this workflow triggers on both (`branches: [... v2]`,
    # `tags: [v*]`). github.ref keeps them apart: measured on run 34126787619,
    # the pull_request checkout was `refs/pull/26/merge`, which carries the PR
    # number, while head_ref was just `fix/ci-self-contained-rake`.
    concurrency:
      group: ${{ github.workflow }}-ruby-floor-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          # "3.2.0", not "3.2". setup-ruby resolves a two-part version to the
          # LATEST patch release, which is not the floor: run 34126787619
          # printed `ruby 3.2.11` for this job. The gemspec promises 3.2.0, so a
          # regression that needs 3.2.1+ would ship green under "3.2". This is
          # the only job that tests the version elkrb actually advertises.
          ruby-version: "3.2.0"
          # No Gemfile.lock is committed. setup-ruby runs `bundle lock` first,
          # which re-resolves to the latest compatible gems and yields the
          # cache key, then installs -- so no separate `bundle install` step.
          bundler-cache: true
      # The whole default task rather than its two commands separately, so CI
      # and a local `bundle exec rake` cannot drift apart.
      - run: bundle exec rake
