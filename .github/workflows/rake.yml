name: rake

permissions:
  contents: read

on:
  push:
    # v2 is the integration branch, so it needs push coverage of its own;
    # pull_request below is unfiltered and covers PRs into it.
    branches: [ master, main, v2 ]
    tags: [ v* ]
  pull_request:
  workflow_dispatch:

jobs:
  rake:
    name: rake (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The reusable workflow this replaces (metanorma/ci/generic-rake.yml)
    # cancelled a superseded in-flight run on the same ref; keep that so a
    # rapid push sequence doesn't queue redundant matrix runs.
    #
    # matrix.os is added to the group by this commit and must not be removed.
    # The group is evaluated per matrix combination and cancel-in-progress
    # cancels the older run in a group, so without it ruby 3.2 on ubuntu,
    # macos and windows would all share `rake-3.2-<ref>` and cancel each
    # other -- two of the three legs would report `cancelled` and only one
    # would actually run. It was absent before this commit only because the
    # matrix was single-OS, where ruby alone made the group unique.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.ruby }}-${{ matrix.os }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # 3.2 is the gemspec floor; the gemspec sets no upper bound, so 4.0
        # is admitted too.
        ruby: [ "3.2", "3.3", "3.4", "4.0" ]
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
    # An ALLOWLIST: blocking only for combinations with a green CI run behind
    # them. Everything else is advisory. Adding a ruby or an OS above therefore
    # lands non-blocking until someone deliberately adds it to the list below,
    # which is the safe direction for a matrix nobody has run yet.
    #
    # The three blocking legs are the ones measured green on this workflow's own
    # run at f0d994b (PR #26):
    #   gh api repos/claricle/elkrb/actions/runs/33870486536/jobs \
    #     --jq '.jobs[]|{name, conclusion}'
    #
    # macOS and Windows are advisory because this repo has NEVER run either.
    # That is the whole reason -- not a claim about how those platforms behave.
    # A local `bundle exec rake` on a developer Mac is not evidence for a
    # macos-latest runner: different toolchain, different installed binaries.
    #
    # HOW TO PROMOTE ONE. A continue-on-error job reports conclusion `success`
    # whatever happened, so the job conclusion cannot tell you. Read the STEP:
    #   gh api repos/claricle/elkrb/actions/runs/<id>/jobs --jq \
    #     '.jobs[]|{name, step: (.steps[]|select(.name|test("rake"))|.conclusion)}'
    # When the `Run bundle exec rake` step is `success` on a leg across a few
    # runs, add that combination to the allowlist below.
    timeout-minutes: 30
    continue-on-error: >-
      ${{ !(matrix.os == 'ubuntu-latest'
            && contains(fromJSON('["3.2","3.3","3.4"]'), matrix.ruby)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # No Gemfile.lock is committed. setup-ruby handles that: it runs
          # `bundle lock` first, which re-resolves to the latest compatible
          # gems and yields the cache key, then installs. The generated
          # lockfile stays in the runner's working tree and is gitignored, so
          # the gem's "resolve fresh every run" rule holds. This also does the
          # install, hence no `bundle install` step.
          bundler-cache: true
      # The whole default task rather than its two commands separately, so CI
      # and a local `bundle exec rake` cannot drift apart.
      - run: bundle exec rake
